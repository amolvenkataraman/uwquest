[project]
name = "uwquest"
dynamic = ["version"]
description = "Read-first CLI and Python client for UWaterloo Quest (PeopleSoft) student self-service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amol Venkataraman" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "selectolax>=0.3.21",
]
keywords = ["uwaterloo", "quest", "peoplesoft", "student", "cli", "unofficial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[project.optional-dependencies]
browser = ["browser-cookie3>=0.19"]   # read the live session straight from the browser
tui = ["textual>=0.60", "rich>=13"]    # the terminal UI (added later)
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
quest = "quest.cli:main"

[project.urls]
Homepage = "https://github.com/amolvenkataraman/uwquest"
Issues = "https://github.com/amolvenkataraman/uwquest/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/quest/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quest"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "BLE", "I", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
